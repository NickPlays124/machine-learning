<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #dff3ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 420;
      }
      h1 {
        margin-bottom: 20px;
        font-size: 48px;
      }

      #webcam-container canvas {
        border-radius: 15px;
        margin-bottom: 15px;
      }

      #hasil {
        font-size: 32px;
        font-weight: bold;
        margin: 10px 0;
      }
      #akurasi {
        font-size: 28px;
        margin-bottom: 20px;
      }
      .bar {
        width: 100%;
        height: 25px;
        background: #ddd;
        border-radius: 20px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        background: limegreen;
        transition: 0.3s;
      }
      .status {
        margin-top: 15px;
        font-size: 24px;
        font-weight: bold;
        color: green;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Dashboard AI</h1>
      <div id="webcam-container"></div>
      <div id="hasil">Mengunggu...</div>
      <div id="akurasi">0%</div>

      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <div class="status">AI Aktif</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script>
      // More API functions here:
      // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/pose

      // the link to your model provided by Teachable Machine export panel
      const URL = "https://teachablemachine.withgoogle.com/models/f15xFzdL3/";
      let model, webcam;

      async function init() {
        try {
          model = await tmImage.load(URL + "model.json", URL + "metadata.json");
          webcam = new tmImage.Webcam(250, 250, true);

          await webcam.setup();
          await webcam.play();

          document
            .getElementById("webcam-container")
            .appendChild(webcam.canvas);

          window.requestAnimationFrame(loop);
        } catch (error) {
          alert("error:" + error);
          console.log(error);
        }
      }

      async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
      }

      async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let best = prediction[0];

        for (let i = 1; i < prediction.length; i++) {
          if (prediction[i].probability > best.probability) {
            best = prediction[i];
          }
        }

        let persen = (best.probability * 100).toFixed(0);

        document.getElementById("hasil").innerText = best.className;

        document.getElementById("akurasi").innerText = persen + "%";

        document.getElementById("fill").style.width = persen + "%";
      }
      init();
    </script>
  </body>
</html>
